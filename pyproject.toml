[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "promo-agent"
version = "0.1.0"
description = "LLM agent that recommends promo discounts using deterministic elasticity tools"
requires-python = ">=3.12"
dependencies = []

[dependency-groups]
dev = ["pytest", "ruff"]

[tool.hatch.build.targets.wheel]
packages = ["src/promo_agent"]

[tool.ruff]
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = ["--import-mode=importlib"]
